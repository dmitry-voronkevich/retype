[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retype"
dynamic = ["version"]
description = "Practice typing with epub books"
readme = "README.rst"
requires-python = ">=3.10,<3.15"
dependencies = [
    "PyQt5>=5.15,<6",
    "ebooklib>=0.18,<1",
    "tinycss2>=1.2,<2",
]

[tool.setuptools]
packages = [
    "qt",
    "retype",
    "retype.console",
    "retype.controllers",
    "retype.extras",
    "retype.layouts",
    "retype.services",
    "retype.stats",
    "retype.ui",
]
zip-safe = false

[tool.setuptools.package-data]
retype = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "retype.__version__"}

[dependency-groups]
test = [
    "pytest>=8,<9",
]
build = [
    "pyinstaller>=6,<7",
    "setuptools>=68",
]
docs = [
    "sphinx>=7,<9",
    "sphinx-jinja>=2,<3",
    "sphinx-rtd-theme>=2,<4",
]
